<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b101b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ramadan Daily">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <link rel="stylesheet" href="./css/app.css">
    <title>Ramadan Daily - Bangladesh</title>
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <h1 class="app-title" id="ui-title">Ramadan Daily</h1>
            <div class="language-control" aria-label="Language selector">
                <span class="micro-label">EN</span>
                <label class="switch" aria-label="Toggle Bangla">
                    <input type="checkbox" id="lang-toggle">
                    <span class="slider"></span>
                </label>
                <span class="micro-label">বাং</span>
            </div>
        </header>

        <section class="settings" aria-label="Settings">
            <button type="button" class="select-trigger" id="division-trigger" aria-haspopup="dialog" aria-expanded="false">
                <span id="selected-division-label">Loading...</span>
                <span class="chevron">▼</span>
            </button>

            <div class="toggle-pill">
                <span class="method-label">
                    <span id="ui-method">Method</span>:
                    <span id="madhab-label" class="accent-text">Hanafi</span>
                </span>
                <label class="switch" aria-label="Toggle Asr method">
                    <input type="checkbox" id="madhab-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </section>

        <section class="hero art-border" aria-live="polite">
            <p id="next-label" class="eyebrow">Next</p>
            <div id="next-time" class="next-time">--:--</div>
            <div class="countdown-row">
                <div id="countdown" class="countdown">00:00:00</div>
            </div>
            <p id="date-display" class="date-display">--</p>
        </section>

        <section class="summary-grid">
            <div class="glass summary-card">
                <p class="card-label" id="ui-sehri-label">Sehri Ends</p>
                <p id="sehri-val" class="card-value">--:--</p>
            </div>
            <div class="glass summary-card">
                <p class="card-label" id="ui-iftar-label">Iftar Time</p>
                <p id="iftar-val" class="card-value iftar">--:--</p>
            </div>
        </section>

        <section class="glass prayer-card" aria-label="Prayer times">
            <div id="prayer-list" class="prayer-list"></div>
        </section>

        <footer class="footer">
            <button id="install-pwa-btn" class="install-button" hidden type="button">
                <svg aria-hidden="true" class="install-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 16V17C4 18.657 5.343 20 7 20H17C18.657 20 20 18.657 20 17V16M16 12L12 16M12 16L8 12M12 16V4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span id="ui-install-text">Install App</span>
            </button>
            <div id="footer-clock" class="footer-clock"></div>
            <div class="made-by">Made by @JOTELTD</div>
        </footer>
    </main>

    <div id="modal-overlay" aria-hidden="true"></div>
    <section id="selection-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-header" aria-hidden="true">
        <div class="sheet-header">
            <h2 id="modal-header">Select Division</h2>
            <button type="button" id="close-modal" class="close-button">Close</button>
        </div>
        <div id="division-list"></div>
    </section>

    <script src="./js/app.js" defer></script>
</body>
</html>
